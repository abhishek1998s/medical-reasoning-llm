# configs/experiment_config.yaml
# Single source of truth for the medical-reasoning fine-tuning experiment.
# DO NOT change values per-track. Only the formatter ID changes.
#
# ============================================================
# CURRENT MODE: FULL RUN (3000 train / 200 test, ~6 h on Kaggle T4)
# ============================================================
# Dry-run mode validated end-to-end at 100 train / 5 test.  All
# pipeline fixes confirmed (single-GPU launcher, strict JSON schema,
# consensus mode without Groq, OVERCONFIDENCE category, BERTScore).
#
# To switch back to DRY mode swap every value marked  # DRY: ...
# back to its dry-run value (and reverse the hub/wandb suffix).
# ============================================================

seed: 42

model:
  name: unsloth/Qwen2.5-1.5B-Instruct-bnb-4bit
  max_seq_length: 4096             # DRY: 2048   (Day 1 measured median content = 1954 tokens)
  load_in_4bit: true
  chat_template: qwen-2.5

dataset:
  name: OpenMed/Medical-Reasoning-SFT-GPT-OSS-120B-V2
  split: train
  shuffle_seed: 42
  max_rows: null                   # DRY: 10000  — cap rows loaded before shuffle/filter; avoids scanning all 506K
  num_train: 3000                  # DRY: 100
  num_val: 100                     # DRY: 10
  num_test: 200                    # DRY: 5
  split_order: shuffle_then_split_then_format
  short_cot_max_tokens: 150
  short_cot_truncate_at: sentence_boundary

training:
  epochs: 1.0
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  optim: adamw_8bit
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8   # DRY: 2     (dry run keeps batch tiny so we get more steps per epoch)
  effective_batch_size: 16         # DRY: 4     (= per_device × gradient_accumulation)
  gradient_checkpointing: unsloth
  eval_strategy: steps
  eval_steps: 50                   # DRY: 10    (dry run: ~2-3 evals across the run)
  save_strategy: steps
  save_steps: 50                   # DRY: 25
  save_total_limit: 2
  logging_steps: 10                # DRY: 2    (dry run: see progress every 2 steps)
  packing: false
  assistant_only_loss: true        # documents intent; we override to False in SFTConfig
                                   # (Unsloth's wrapper conflicts with TRL's native path —
                                   # we use train_on_responses_only instead, see Section 5)

lora:
  r: 16
  alpha: 16
  dropout: 0.0          # was 0.05; required for Unsloth's fast LoRA QKV/O/MLP kernels
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_rslora: false

inference:
  temperature: 0.0
  do_sample: false
  max_new_tokens:
    track_A: 768          # bumped from 400; dry-run truncation_rate was 40% for Track A
    track_B: 400
  repetition_penalty: 1.0
  batch_size: 1
  warmup_runs: 3
  log_finish_reason: true
  log_truncated_flag: true

outputs:
  save_adapters_only: true
  push_to_hub: true
  private_hub_repo: true

logging:
  report_to: wandb
  fallback_report_to: none
  save_local_json_log: true
  wandb_project: medical-reasoning-sft
  wandb_runs:
    trackA: trackA-v0              # DRY: trackA-v0-dryrun
    trackB: trackB-v0              # DRY: trackB-v0-dryrun

hub:
  username: kabhisheks              # HuggingFace username (different from GitHub username abhishek1998s)
  repos:
    trackA: qwen25-1.5b-medreason-trackA-v0       # DRY: qwen25-1.5b-medreason-trackA-dryrun
    trackB: qwen25-1.5b-medreason-trackB-v0       # DRY: qwen25-1.5b-medreason-trackB-dryrun

judge:
  consensus_mode: true              # true = call every available judge per row and aggregate.
                                    # false = single-judge fallback chain. Use true for the report-quality run.
  providers:                        # which judges to initialise (priority order in fallback mode,
                                    # union in consensus mode).
    - cerebras                      # gpt-oss-120b (different family from Qwen student; 1M TPD)
    - gemini                        # gemini-2.5-flash (different vendor; ~1500 RPD)
  # groq is intentionally omitted: 100K tokens/day free-tier cap is insufficient
  # for 200 rows x 2 tracks x ~2K tok/call = ~800K tokens. Add it back here for
  # dry-run testing (5 rows fits well within Groq's daily budget).
