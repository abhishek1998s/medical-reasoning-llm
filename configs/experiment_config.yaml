# configs/experiment_config.yaml
# Single source of truth for the medical-reasoning fine-tuning experiment.
# DO NOT change values per-track. Only the formatter ID changes.
#
# ============================================================
# CURRENT MODE: DRY RUN / SMOKE TEST (~12-15 min on Kaggle T4)
# ============================================================
# Smoke-test values for fast pipeline validation:
#   100 train / 10 val / 5 test, max_rows=3000, seq=4096,
#   grad_accum=2, effective batch=4.
# Hub repos and W&B run names suffixed with -dryrun to keep
# the full-run artefacts uncontaminated.
#
# To switch back to FULL mode, swap every value marked  # FULL: ...
# back (or just revert this commit).
# ============================================================

seed: 42

model:
  # Switched from Qwen2.5-1.5B to Llama-3.2-3B for 2x parameter count.
  # Llama-3.2 uses the same chat template as Llama-3.1 ("llama-3.1" in Unsloth).
  # 3B at 4-bit = ~2 GB; fits T4 16 GB with ~10 GB headroom for activations.
  # train_sft.py auto-detects chat template from model name (llama-3 -> llama-3.1).
  name: unsloth/Llama-3.2-3B-Instruct-bnb-4bit
  # max_seq_length MUST be >= input_prompt + max_new_tokens or the model cannot
  # attend to the full prompt during inference. Track A: ~400 prompt + 2048 output
  # = ~2448. At 2048 the prompt context gets evicted partway through generation,
  # silently breaking Track A outputs. 4096 fits both tracks with margin.
  # Llama-3.2 supports up to 131K natively; 4096 is a training/VRAM choice, not
  # a model capability ceiling.
  max_seq_length: 4096             # FULL: 4096  (same — already the right value)
  load_in_4bit: true
  chat_template: llama-3.1         # Llama 3.2 reuses the Llama 3.1 chat template

dataset:
  name: OpenMed/Medical-Reasoning-SFT-GPT-OSS-120B-V2
  split: train
  shuffle_seed: 42
  max_rows: 3000                   # FULL: null  — load only 3000 rows for the smoke test.
                                   # Filter step finishes in <30s on 3000 rows; we then pick 115 of them
                                   # for train (100) / val (10) / test (5). Bigger pool = better diversity
                                   # but the smoke test only needs 'does the pipeline run end-to-end?'
  num_train: 100                   # FULL: 3000
  num_val: 10                      # FULL: 100
  num_test: 5                      # FULL: 200
  split_order: shuffle_then_split_then_format
  short_cot_max_tokens: 150
  short_cot_truncate_at: sentence_boundary

training:
  epochs: 1.0
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  optim: adamw_8bit
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 2   # FULL: 8    (dry run keeps batch tiny so we get more steps per epoch)
  effective_batch_size: 4          # FULL: 16   (= per_device × gradient_accumulation)
  gradient_checkpointing: unsloth
  eval_strategy: steps
  eval_steps: 10                   # FULL: 50   (dry run: ~2-3 evals across the run)
  save_strategy: steps
  save_steps: 25                   # FULL: 50
  save_total_limit: 2
  logging_steps: 2                 # FULL: 10   (dry run: see progress every 2 steps)
  packing: false
  # Loss mode (single source of truth): we mask user/system tokens via Unsloth's
  # train_on_responses_only after building the SFTTrainer. TRL's native
  # assistant_only_loss=True path conflicts with Unsloth's compiled SFTTrainer
  # wrapper, so we keep this False and rely on the post-build mask.
  assistant_only_loss: false
  train_on_responses_only: true    # documents the active loss-masking choice
  max_grad_norm: 1.0               # explicit default; clip per-step gradient L2 norm

lora:
  r: 16
  alpha: 16
  dropout: 0.0          # was 0.05; required for Unsloth's fast LoRA QKV/O/MLP kernels
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_rslora: false

inference:
  temperature: 0.0
  do_sample: false
  # Naming note: trackA / trackB (camelCase) is used here to match
  # logging.wandb_runs and hub.repos — single naming convention across the
  # whole config and codebase.
  max_new_tokens:
    # Full-run measurement: trackA was 82.5% truncated at 768; trackB was 70.5%
    # truncated at 400. Completed Track A outputs averaged 263 tokens (so 768 was
    # too tight a cap for the long tail), Track B averaged 151. Bumping by 2.5-3x:
    trackA: 2048         # was 768 / originally 400
    trackB: 1024         # was 400
  repetition_penalty: 1.15         # was 1.0; Llama-3.2-3B smoke run produced tautological
                                   # loops ("X is the X") under greedy decoding with no
                                   # penalty. 1.15 discourages the loop without hurting
                                   # fluency. Bump to 1.2 if loops still appear.
  batch_size: 1
  warmup_runs: 3
  log_finish_reason: true
  log_truncated_flag: true

outputs:
  save_adapters_only: true
  push_to_hub: true
  private_hub_repo: true

logging:
  report_to: wandb
  fallback_report_to: none
  save_local_json_log: true
  wandb_project: medical-reasoning-sft
  wandb_runs:
    trackA: trackA-v0-dryrun       # FULL: trackA-v0
    trackB: trackB-v0-dryrun       # FULL: trackB-v0

hub:
  username: kabhisheks              # HuggingFace username (different from GitHub username abhishek1998s)
  repos:
    # Renamed to llama32-3b after the base-model swap. Old qwen25-1.5b
    # adapters remain on HF Hub as historical artefacts of the previous run.
    trackA: llama32-3b-medreason-trackA-dryrun   # FULL: llama32-3b-medreason-trackA-v0
    trackB: llama32-3b-medreason-trackB-dryrun   # FULL: llama32-3b-medreason-trackB-v0

judge:
  consensus_mode: true              # true = call every available judge per row and aggregate.
                                    # false = single-judge fallback chain. Use true for the report-quality run.
  providers:                        # which judges to initialise (priority order in fallback mode,
                                    # union in consensus mode).
    - cerebras                      # gpt-oss-120b (different family from Qwen student; 1M TPD)
    - gemini                        # gemini-2.5-flash (different vendor; ~1500 RPD)
  # groq is intentionally omitted: 100K tokens/day free-tier cap is insufficient
  # for 200 rows x 2 tracks x ~2K tok/call = ~800K tokens. Add it back here for
  # dry-run testing (5 rows fits well within Groq's daily budget).
  sleep_seconds: 2.0                # pace between calls; 30 RPM = 2.0s.
                                    # Full run had 754 Gemini 429s with sleep=0.3 — bumped to stay under caps.
                                    # judge_all internally retries with exp backoff on transient 429/503.
